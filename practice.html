<h2>اليوم 1: العربية مع المساعد: اضبط وقابل وراجع</h2>
<ol>
<li><p>طلبت من المساعد «خطابًا رسميًّا مهذبًا» لرئيس الجمعية. جاء الخطاب مهذبًا، يبدأ بـ«عزيزي السيد ميسرة»، وتاريخه ميلادي فقط، وفيه «تم تحديد الموسم من قبل الهيئة». ما التعديل الأنفع؟</p><ul><li><b>أ.</b> أن تطلب «أسلوبًا أكثر رسمية وفخامة»</li><li><b>ب.</b> أن تسمّي الأعراف والجمهور والأنماط التي تتجنبها</li><li><b>ج.</b> أن تصحّح الخطاب بيدك وتُبقي الأمر كما هو</li><li><b>د.</b> أن تلصق خطابًا قديمًا طويلًا وتقول «مثل هذا»</li></ul></li>
<li><p>ألصقت المسرد المعتمد في الأمر وترجم المساعد صفحة من السياسة إلى الإنجليزية. قرأت الترجمة فوجدتها سلسة، وطلبت ترجمة عكسية فعادت مطابقة للأصل في المعنى. ما الخطوة الباقية؟</p><ul><li><b>أ.</b> لا شيء: الترجمة العكسية أثبتت الدقة</li><li><b>ب.</b> لا شيء: المسرد كان في الأمر</li><li><b>ج.</b> أن تسأل المساعد: هل التزمت بالمسرد؟</li><li><b>د.</b> أن تفحص مواضع المصطلحات واحدًا واحدًا بالمسرد</li></ul></li>
<li><p>ملخص عربي لتقرير إنجليزي فيه أربع جمل. لديك دقيقتان قبل أن يُرسل إلى الجمعيات. أيها تقابله بالمصدر أولًا؟</p><ul><li><b>أ.</b> «يُصرف الدعم لكل الصيادين الحرفيين»</li><li><b>ب.</b> «أُخذت العينات من 18 موقع إنزال»</li><li><b>ج.</b> «تراجع الإنزال في السنوات الثلاث الماضية تراجعًا متصلًا يدعو إلى القلق»</li><li><b>د.</b> «وذلك من أجل حماية المخزون بشكل فعّال»</li></ul></li>
<li><p>قارنت مساعدين. الأول أعلى في الخطاب الرسمي والترجمة بالمسرد. في تفريغ رسالة صوتية بلهجة لا تتكلمها أنت، أخطأ الأول في 14% من الكلمات والثاني في 45%. ما القرار؟</p><ul><li><b>أ.</b> الأول للمهام كلها: هو الأقوى في العربية</li><li><b>ب.</b> الأول للتفريغ النصي: خطؤه مقبول</li><li><b>ج.</b> لا يُعتمد تفريغ أي منهما قبل مراجع من أهل اللهجة</li><li><b>د.</b> أراجع تفريغ الأول بنفسي ثم أعتمده</li></ul></li>
<li><p>في تعميم نصي يظهر رقم المرجع معكوسًا. حذفته وكتبته من جديد في مكانه فظهر معكوسًا مرة أخرى. في المحرر، بعد إظهار العلامات، ترى علامة قبل الرقم وأخرى بعده. ماذا تفعل؟</p><ul><li><b>أ.</b> أحذف العلامتين، والرقم المخزَّن سليم</li><li><b>ب.</b> أكتب الرقم معكوسًا ليظهر سليمًا</li><li><b>ج.</b> أغيّر اتجاه السطر كله إلى اليسار</li><li><b>د.</b> أضيف علامة ثالثة قبل الرقم تثبّته</li></ul></li>
<li><p>إشعار عام بالعربية والإنجليزية عن غرامة، ترجمه مساعد. فحصته بأدوات اليوم وصحّحت كل ما وجدته، وطلبت ترجمة عكسية فعادت سليمة. فيه عبارة مقتبسة من صياد بلهجة لا تتكلمها. الموعد غدًا والمترجمة المعتمدة مشغولة. ما القرار؟</p><ul><li><b>أ.</b> أنشره: الترجمة العكسية سليمة وقد صححت ما وجدت</li><li><b>ب.</b> أنشره مع سطر يقول إنه مترجم بمساعد ولم يراجعه أحد</li><li><b>ج.</b> أعرضه على مساعد ثانٍ، فإن وافق نشرته</li><li><b>د.</b> أحيله إلى المترجمة ومراجع من أهل اللهجة، وأبلغ عن الموعد</li></ul></li>
<li><p>تريد إشعارًا يقرؤه مراجعون واقفون في صالة خدمة. أي سطر تضيفه إلى الأمر ليخرج النص بعربية مبسطة؟</p><ul><li><b>أ.</b> «اكتب بلغة سهلة يفهمها الجميع»</li><li><b>ب.</b> «اكتب بالعامية ليكون قريبًا من الناس»</li><li><b>ج.</b> «فصحى مبسطة، جمل لا تزيد على 14 كلمة، وخطاب مباشر بصيغة المفرد، ولا ألفاظ إدارية مثل بموجب والمشار إليه»</li><li><b>د.</b> «اختصر النص إلى النصف»</li></ul></li>
<li><p>قيّمت خطابًا رسميًّا كتبه مساعد فاستوفى تسع نقاط من عشر، والنقطة الساقطة «التاريخ بالتقويمين». أضاف المساعد بعد المراجعة تاريخًا هجريًّا. ماذا بقي عليك؟</p><ul><li><b>أ.</b> لا شيء: صارت الدرجة عشرًا من عشر</li><li><b>ب.</b> أن تقابل التاريخ الهجري بالميلادي في التقويم الرسمي</li><li><b>ج.</b> أن تطلب من المساعد أن يؤكد أن التاريخ صحيح</li><li><b>د.</b> أن تحذف التاريخ الميلادي وتُبقي الهجري</li></ul></li>
<li><p>أي جملة من هذه تبدو مترجمة عن الإنجليزية أكثر من غيرها؟</p><ul><li><b>أ.</b> حددت الهيئة موسم الحظر لهذا العام</li><li><b>ب.</b> يبدأ الحظر يوم الأربعاء وينتهي بعد 61 يومًا</li><li><b>ج.</b> نأمل من سعادتكم إبلاغ أعضاء الجمعية</li><li><b>د.</b> تم تحديد موسم الحظر من قبل الهيئة بشكل نهائي</li></ul></li>
<li><p>ستترجم سياسة من ثلاث صفحات بمساعد، وليس لإدارتك مسرد. ما الخطوة الأولى؟</p><ul><li><b>أ.</b> أن تستخرج مصطلحات السياسة وتكتب مقابلاتها بنفسك، ثم تعرضها على صاحب الاختصاص</li><li><b>ب.</b> أن تطلب الترجمة ثم تستخرج المسرد منها</li><li><b>ج.</b> أن تطلب من المساعد مسردًا وتعتمده كما هو</li><li><b>د.</b> أن تترجم صفحة صفحة وتراجع السلاسة</li></ul></li>
<li><p>ألصقت مسردًا من 20 مصطلحًا في الأمر. كيف تتحقق من أن الترجمة التزمت به؟</p><ul><li><b>أ.</b> تقرأ الترجمة كاملة وتنتبه لما يبدو غريبًا</li><li><b>ب.</b> تطلب ترجمة عكسية وتقابلها بالأصل</li><li><b>ج.</b> تأخذ مواضع المصطلحات في المصدر وتبحث عن المقابل المعتمد في كل موضع</li><li><b>د.</b> تعدّ كلمات الترجمة وتقارنها بعدد كلمات المصدر</li></ul></li>
<li><p>في مذكرة رسمية لجهة تعتمد معجم البيانات والذكاء الاصطناعي الصادر عن سدايا، كتب المساعد «التعلم الآلي» والمعجم يكتب «تعلُّم الآلة». ما التصرف؟</p><ul><li><b>أ.</b> تتركها: المعنى واحد والقارئ يفهم</li><li><b>ب.</b> تستبدلها بمقابل المعجم، وتضيفها إلى المسرد الذي تلصقه في الأمر</li><li><b>ج.</b> تكتب المصطلحين معًا في كل موضع</li><li><b>د.</b> تسأل المساعد أيهما أصح لغويًّا</li></ul></li>
<li><p>في التقرير الإنجليزي: within 12 nautical miles. وفي الملخص العربي: «ضمن 12 كيلومترًا». ما نوع الخطأ وما أثره؟</p><ul><li><b>أ.</b> خطأ رقم: يُصحَّح الرقم إلى 22</li><li><b>ب.</b> ليس خطأ: الميل والكيلومتر متقاربان في ملخص</li><li><b>ج.</b> خطأ اسم: المصطلح البحري لم يُنقل</li><li><b>د.</b> خطأ وحدة: بقي الرقم وتبدلت وحدته، فصارت المسافة نحو نصفها</li></ul></li>
<li><p>في ترجمة إنجليزية لتعميم: Saturday, 30 October 2027. تحققت في التقويم فوجدت أن 30 أكتوبر 2027 يوم سبت فعلًا. هل انتهى الفحص؟</p><ul><li><b>أ.</b> نعم: اليوم يوافق التاريخ</li><li><b>ب.</b> نعم، إذا وافق التاريخ الهجري أيضًا</li><li><b>ج.</b> لا: يبقى أن تقابله بالتاريخ الذي في التعميم نفسه</li><li><b>د.</b> لا: يجب تحويله إلى الصيغة الأمريكية</li></ul></li>
<li><p>تراجع ترجمة عربية لتوصيات إنجليزية. أي بحث يكشف المحذوف الذي يغيّر الحكم؟</p><ul><li><b>أ.</b> أن تبحث في المصدر عن only و not و unless و provided، ثم عن مقابل كل منها في الترجمة</li><li><b>ب.</b> أن تعدّ الجمل في النصين</li><li><b>ج.</b> أن تقرأ الترجمة وتسأل: هل هي مفهومة؟</li><li><b>د.</b> أن تقابل الأرقام كلها</li></ul></li>
<li><p>لماذا تكون الجولة الأولى من مقابلة المخرج بالمصدر دون مساعد؟</p><ul><li><b>أ.</b> لأن المساعد لا يستطيع المقارنة بين نصين</li><li><b>ب.</b> لأن استخدامه في الفحص ممنوع</li><li><b>ج.</b> لأن الجولة اليدوية أسرع</li><li><b>د.</b> لأن من يبدأ بقائمة المساعد يكتفي بها، وتفوته الأنواع التي لا يراها المساعد</li></ul></li>
<li><p>تقارن مساعدين على كتابة إشعار. الأول أعطاك مسودة ضعيفة فحاورته ثلاث جولات حتى تحسنت، والثاني أخذت مسودته الأولى. ما العيب في المقارنة؟</p><ul><li><b>أ.</b> لا عيب: المهم النتيجة النهائية</li><li><b>ب.</b> المقارنة غير عادلة: الأمر والجولات يجب أن تكون واحدة للاثنين</li><li><b>ج.</b> العيب أنك لم تجرّب مساعدًا ثالثًا</li><li><b>د.</b> العيب أن الإشعار مهمة سهلة لا تصلح للمقارنة</li></ul></li>
<li><p>رسالة صوتية من مراجع بلهجته. فرّغها مساعد بفصحى سليمة واضحة المعنى. الملف سيُحفظ دليلًا على ما قاله المراجع. هل يصلح؟</p><ul><li><b>أ.</b> نعم: المعنى صحيح والنص أوضح</li><li><b>ب.</b> نعم، إذا كُتب تحته أنه مفرَّغ بمساعد</li><li><b>ج.</b> لا: يُحذف التفريغ ويُكتفى بالملف الصوتي</li><li><b>د.</b> لا: السجل يحتاج إلى تفريغ حرفي بلهجته يراجعه أحد من أهلها، والفصحى تُكتب بعده لا بدله</li></ul></li>
<li><p>في جدول المقارنة لم يبلغ أي من المساعدين الدرجة 2 في مهمة التفريغ النصي للهجة، وبلغها أحدهما في كل مهمة أخرى. ماذا تكتب في خانة هذه المهمة؟</p><ul><li><b>أ.</b> «يُستخدم الأعلى درجة منهما»</li><li><b>ب.</b> «تُعاد المقارنة حتى ينجح أحدهما»</li><li><b>ج.</b> «لا يصلح أي منهما دون مراجع من أهل اللهجة»، مع الدليل ومن يراجع</li><li><b>د.</b> «المهمة خارج قدرة الذكاء الاصطناعي»</li></ul></li>
<li><p>في سطر عربي من رسالة نصية يظهر رقم الهاتف وعلامة الجمع بعده لا قبله. الرقم في الملف مكتوب صحيحًا. ما الإصلاح؟</p><ul><li><b>أ.</b> أن تكتب علامة الجمع بعد الرقم في الملف</li><li><b>ب.</b> أن تحذف علامة الجمع</li><li><b>ج.</b> أن تكتب الرقم بالأرقام المشرقية</li><li><b>د.</b> أن تعزل الرقم: علامة LRM قبله في النص المجرد، أو عنصر اتجاهه من اليسار في الصفحة</li></ul></li>
<li><p>سطر في نموذج إلكتروني: يبدأ باسم نظام بحروف لاتينية ثم جملة عربية تنتهي بنقطة. يظهر السطر محاذيًا لليسار والنقطة في أوله. لماذا؟</p><ul><li><b>أ.</b> لأن أول حرف قوي في السطر لاتيني، فعُرضت الفقرة من اليسار</li><li><b>ب.</b> لأن النموذج لا يدعم العربية</li><li><b>ج.</b> لأن النقطة كُتبت في أول الجملة</li><li><b>د.</b> لأن الاسم اللاتيني أطول من الجملة العربية</li></ul></li>
<li><p>في شريحة عربية كُتب: الغرامة 5,000 ريال، والرقم وكلمة «ريال» داخل عنصر واحد اتجاهه من اليسار. فظهرت «ريال» قبل الرقم. ما الإصلاح؟</p><ul><li><b>أ.</b> أن تكتب «ريال» قبل الرقم في المصدر</li><li><b>ب.</b> أن تجعل عنصر الاتجاه حول الرقم وحده، وتُخرج الكلمة العربية منه</li><li><b>ج.</b> أن تضيف علامة غير مرئية بين الرقم والكلمة</li><li><b>د.</b> أن تجعل اتجاه الشريحة كلها من اليسار</li></ul></li>
</ol>
